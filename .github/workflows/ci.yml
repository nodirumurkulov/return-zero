name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      OPENAI_API_KEY: sk-test
      LLM_PROVIDER: openai
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun ci
      - run: bun run check

      - uses: supabase/setup-cli@v1
        with:
          version: 2.34.3

      - name: Supabase
        working-directory: frontend/supabase
        run: |
          supabase start
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"

      - run: bun run db:reset && bun run seed && bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
        env:
          CI: true
